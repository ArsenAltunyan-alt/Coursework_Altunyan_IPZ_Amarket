{% extends "main/base.html" %}

{% block title %}Повідомлення{% endblock %}

{% block extra_css %}
<style>
    .chat-shell {
        background: #f6f8fb;
        border-radius: 16px;
        padding: 20px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
    }

    .chat-list .list-group-item {
        border: 0;
        border-bottom: 1px solid rgba(0, 0, 0, 0.05);
        transition: background 0.2s ease, color 0.2s ease;
    }

    .chat-list .list-group-item:hover {
        background: rgba(6, 187, 204, 0.1);
    }

    .chat-list .list-group-item.active {
        background: #06bbcc;
        color: #fff;
    }

    .chat-list .list-group-item.active small,
    .chat-list .list-group-item.active .text-muted {
        color: rgba(255, 255, 255, 0.8) !important;
    }
    .chat-list .list-group-item:last-child {
        border-bottom-left-radius: 9px;
        border-bottom-right-radius: 9px;
    }

    .chatbox {
        background: #fff;
        border-radius: 16px;
        padding: 16px;
        height: 60vh;
        overflow-y: auto;
    }

    .chat-message {
        display: flex;
        margin-bottom: 12px;
    }

    .chat-message.sender {
        justify-content: flex-end;
    }

    .message-bubble {
        max-width: 75%;
        padding: 12px 16px;
        border-radius: 14px;
        background: rgba(6, 187, 204, 0.1);
        color: #1f2a37;
    }

    .chat-message.sender .message-bubble {
        background: #06bbcc;
        color: #fff;
        border-bottom-right-radius: 4px;
    }

    .chat-message.receiver .message-bubble {
        background: #f1f4f8;
        border-bottom-left-radius: 4px;
    }

    .message-meta {
        display: flex;
        gap: 10px;
        justify-content: flex-end;
        font-size: 12px;
        margin-top: 6px;
        opacity: 0.8;
    }
    .read-status {
        display: inline-flex;
        align-items: center;
        gap: 2px;
    }
    .read-status svg {
        width: 14px;
        height: 10px;
        stroke: currentColor;
        stroke-width: 2;
        fill: none;
        stroke-linecap: round;
        stroke-linejoin: round;
    }

    .chat-input {
        background: #fff;
        border-radius: 18px;
        padding: 12px;
        margin-top: 16px;
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.05);
    }

    .chat-input .input-group {
        gap: 0;
        align-items: center;
    }

    .chat-input .form-control {
        height: 44px;
        border-radius: 999px 0 0 999px;
        border: 1px solid #f28c28;
        border-right: 0;
        padding: 10px 16px;
        box-shadow: none;
        background: #fff;
    }

    .chat-input .form-control:focus {
        border-color: #f28c28;
        box-shadow: 0 0 0 2px rgba(242, 140, 40, 0.2);
    }
    .chat-input .form-control:disabled {
        background: #fff;
        opacity: 1;
    }

    .btn-send {
        background: #f28c28;
        border-color: #f28c28;
        color: #fff;
        border-radius: 0 999px 999px 0;
        height: 44px;
        padding: 0 18px;
        font-weight: 600;
    }

    .btn-send:hover {
        background: #ea7b12;
        border-color: #ea7b12;
        color: #fff;
    }

    .btn-attach {
        background: #fff;
        border: 1px solid #f28c28;
        border-left: 0;
        border-right: 0;
        color: #f28c28;
        width: 44px;
        height: 44px;
        border-radius: 0;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 0;
    }

    .btn-attach:hover {
        background: #fff6ee;
    }
    .btn-attach:disabled {
        background: #fff;
        color: #f28c28;
        opacity: 1;
    }

    .paperclip-icon {
        width: 18px;
        height: 18px;
        display: inline-block;
        background: no-repeat center / contain;
        background-image: url("data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='24' height='24' fill='none' stroke='%23f28c28' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M21.44 11.05l-8.49 8.49a5 5 0 01-7.07-7.07l8.49-8.49a3.5 3.5 0 014.95 4.95l-8.5 8.49a2 2 0 11-2.83-2.83l7.78-7.78'/%3E%3C/svg%3E");
    }
</style>
{% endblock %}

{% block content %}
<div class="container-fluid py-5">
    <div class="container" id="chat-page" data-current-username="{{ request.user.username }}">
        <div class="chat-shell">
            <div class="row g-4">
                <div class="col-12 col-lg-4">
                    <div class="card border-0 shadow-sm">
                        <div class="card-header bg-primary text-white d-flex align-items-center justify-content-between">
                            <span>Повідомлення</span>
                        </div>
                        <div class="card-body p-0">
                            <div id="chat-list"
                                hx-get="{% url 'chat:list' %}"
                                hx-trigger="load, refresh, every 5s"
                                hx-target="#chat-list"
                                hx-swap="innerHTML"
                                hx-include="#current-room">
                                {% include "chat/partials/chat_list.html" %}
                            </div>
                        </div>
                    </div>
                </div>

                <div class="col-12 col-lg-8">
                    <div id="chat-panel">
                        {% include "chat/partials/chat_panel.html" %}
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script src="https://unpkg.com/htmx.org@1.9.12"></script>
<script>
    function initChatPanel() {
        const page = document.querySelector("#chat-page");
        const currentUsername = page ? page.dataset.currentUsername : "";
        const panel = document.querySelector("#chat-panel");
        const roomInput = document.querySelector("#current-room");
        const roomName = roomInput ? roomInput.value : "";
        const announcementInput = panel ? panel.querySelector("#current-announcement") : null;
        const announcementId = announcementInput ? announcementInput.value : "";
        const chatbox = panel ? panel.querySelector("#chatbox") : null;
        const input = panel ? panel.querySelector("#my_input") : null;
        const submitButton = panel ? panel.querySelector("#submit_button") : null;
        const imageInput = panel ? panel.querySelector("#image_input") : null;
        const attachButton = panel ? panel.querySelector("#attach_button") : null;
        const deleteButton = panel ? panel.querySelector("[data-chat-delete]") : null;

        function scrollToBottom() {
            if (chatbox) {
                chatbox.scrollTop = chatbox.scrollHeight;
            }
        }

        scrollToBottom();

        if (deleteButton) {
            deleteButton.addEventListener("click", function (event) {
                if (!confirm("Видалити цей чат і всі повідомлення?")) {
                    event.preventDefault();
                }
            });
        }

        if (!roomName) {
            if (window.chatSocket) {
                window.chatSocket.close();
                window.chatSocket = null;
            }
            return;
        }

        if (window.chatSocket) {
            window.chatSocket.close();
        }

        const wsScheme = window.location.protocol === "https:" ? "wss" : "ws";
        window.chatSocket = new WebSocket(
            wsScheme + "://" + window.location.host + "/ws/chat/" + roomName + "/"
        );

        window.chatSocket.onopen = function () {
            console.log("WebSocket connected.");
        };
        window.chatSocket.onclose = function () {
            console.log("WebSocket closed.");
        };

        if (input) {
            input.onkeyup = function (e) {
                if (e.keyCode == 13) {
                    e.preventDefault();
                    submitButton.click();
                }
            };
        }

        if (submitButton) {
            submitButton.onclick = function () {
                const messageInput = input.value.trim();

                if (messageInput.length == 0) {
                    alert("Add some input first or press the Send button!");
                } else {
                    window.chatSocket.send(
                        JSON.stringify({
                            message: messageInput,
                            username: currentUsername,
                            room_name: roomName,
                            announcement_id: announcementId || null,
                        })
                    );
                    input.value = "";
                    const chatList = document.querySelector("#chat-list");
                    if (chatList) {
                        htmx.trigger(chatList, "refresh");
                    }
                }
            };
        }

        function getCookie(name) {
            const cookieValue = document.cookie
                .split("; ")
                .find((row) => row.startsWith(name + "="));
            return cookieValue ? decodeURIComponent(cookieValue.split("=")[1]) : "";
        }

        function uploadImage() {
            if (!imageInput || !imageInput.files || imageInput.files.length === 0) {
                return;
            }
            const uploadUrl = attachButton ? attachButton.dataset.uploadUrl : "";
            if (!uploadUrl) {
                alert("Upload URL is missing.");
                return;
            }
            const formData = new FormData();
            formData.append("image", imageInput.files[0]);
            if (announcementId) {
                formData.append("announcement", announcementId);
            }

            fetch(uploadUrl, {
                method: "POST",
                headers: {
                    "X-CSRFToken": getCookie("csrftoken"),
                },
                body: formData,
            })
                .then((response) => {
                    if (!response.ok) {
                        throw new Error("Upload failed");
                    }
                    return response.json();
                })
                .then(() => {
                    imageInput.value = "";
                    const chatList = document.querySelector("#chat-list");
                    if (chatList) {
                        htmx.trigger(chatList, "refresh");
                    }
                })
                .catch(() => {
                    alert("Image upload failed.");
                });
        }

        if (attachButton && imageInput) {
            attachButton.onclick = function () {
                imageInput.click();
            };
            imageInput.onchange = function () {
                uploadImage();
            };
        }

        window.chatSocket.onmessage = function (e) {
            const data = JSON.parse(e.data);

            if (data.type === "read_receipt") {
                const statusEl = document.querySelector(
                    `.read-status[data-message-id="${data.message_id}"]`
                );
                if (statusEl) {
                    statusEl.innerHTML = "<svg viewBox='0 0 16 10' aria-hidden='true'><path d='M1 5l3 3 6-6'/><path d='M7 5l3 3 5-5'/></svg>";
                }
                return;
            }

            if ((data.message || data.image_url) && data.sender) {
                const noMessages = document.querySelector(".no-messages");
                if (noMessages) {
                    noMessages.style.display = "none";
                }

                const div = document.createElement("div");
                div.className =
                    "chat-message " +
                    (data.sender === currentUsername
                        ? "sender"
                        : "receiver");

                const bubble = document.createElement("div");
                bubble.className = "message-bubble";

                if (
                    data.announcement &&
                    data.announcement.title &&
                    data.announcement.url &&
                    data.announcement.seller_username === currentUsername &&
                    data.sender !== currentUsername
                ) {
                    const announcementLine = document.createElement("div");
                    announcementLine.className = "small text-muted mb-1";
                    announcementLine.innerHTML =
                        "Regarding listing: " +
                        '<a href="' + data.announcement.url + '">' +
                        data.announcement.title +
                        "</a>";
                    bubble.appendChild(announcementLine);
                }

                if (data.message) {
                    const text = document.createElement("div");
                    text.className = "message-text";
                    text.textContent = data.message;
                    bubble.appendChild(text);
                }

                if (data.image_url) {
                    const imageWrap = document.createElement("div");
                    imageWrap.className = "message-image mt-2";
                    const img = document.createElement("img");
                    img.src = data.image_url;
                    img.alt = "Chat image";
                    img.style.maxWidth = "260px";
                    img.style.width = "100%";
                    img.style.borderRadius = "10px";
                    imageWrap.appendChild(img);
                    bubble.appendChild(imageWrap);
                }

                const meta = document.createElement("div");
                meta.className = "message-meta";

                const time = document.createElement("span");
                const date = new Date();
                time.textContent = date.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
                meta.appendChild(time);

                if (data.sender === currentUsername) {
                    const status = document.createElement("span");
                    status.className = "read-status";
                    if (data.message_id) {
                        status.setAttribute("data-message-id", data.message_id);
                    }
                    status.innerHTML = "<svg viewBox='0 0 16 10' aria-hidden='true'><path d='M1 5l3 3 6-6'/></svg>";
                    meta.appendChild(status);
                }

                bubble.appendChild(meta);
                div.appendChild(bubble);
                if (chatbox) {
                    chatbox.appendChild(div);
                }
                scrollToBottom();

                const lastMessage = document.querySelector(
                    ".list-group-item.active .last-message"
                );
                if (lastMessage) {
                    const preview = data.image_url ? "Photo" : data.message;
                    lastMessage.textContent =
                        data.sender === currentUsername
                            ? "You: " + preview
                            : preview;

                    const timestamp = document.querySelector(
                        ".list-group-item.active .timestamp"
                    );
                    if (timestamp) {
                        timestamp.textContent = time.textContent;
                    }

                    const chats = document.querySelectorAll(".list-group-item");
                    const chatsArray = Array.from(chats);
                    const chatsSorted = chatsArray.sort((a, b) => {
                        const aTime = a.querySelector("small").innerHTML;
                        const bTime = b.querySelector("small").innerHTML;
                        return aTime < bTime ? 1 : -1;
                    });

                    const contacts = document.querySelector(".chat-list");
                    if (contacts) {
                        contacts.innerHTML = "";
                        chatsSorted.forEach((chat) => {
                            contacts.appendChild(chat);
                        });
                    }
                } else {
                    console.error("No active chat selected");
                }
                const chatList = document.querySelector("#chat-list");
                if (chatList) {
                    htmx.trigger(chatList, "refresh");
                }
            } else {
                console.error("Message or sender data is missing:", data);
            }
        };
    }

    document.addEventListener("DOMContentLoaded", initChatPanel);

    document.body.addEventListener("htmx:afterSwap", function (event) {
        if (event.target.id === "chat-panel") {
            initChatPanel();
            const chatList = document.querySelector("#chat-list");
            if (chatList) {
                htmx.trigger(chatList, "refresh");
            }
        }
    });
</script>
{% endblock %}
